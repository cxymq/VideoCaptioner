version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # yt-dlp must track site changes (Bilibili/YouTube) closely;
    # other dependencies are left to manual upgrades.
    allow:
      - dependency-name: "yt-dlp"
      - dependency-name: "yt-dlp-ejs"
    commit-message:
      prefix: "chore(deps)"
